import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}
repositories {
    mavenCentral()
}
android {
    compileSdk = project.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }

    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        // When the release keystore is not present locally (it is blackbox-
        // encrypted and only deployed on CI), fall back to the default debug
        // keystore so every variant can build without secrets.
        def keystoreFile = file("../keyStore/release.jks")
        if (keystoreFile.exists()) {
            free {
                storeFile keystoreFile
                storePassword String.valueOf(System.getenv("SIGN_KEY_PASSWORD"))
                keyAlias "key0"
                keyPassword String.valueOf(System.getenv("SIGN_KEY_PASSWORD"))
            }
            pro {
                storeFile keystoreFile
                storePassword String.valueOf(System.getenv("SIGN_KEY_PASSWORD"))
                keyAlias "key_pro"
                keyPassword String.valueOf(System.getenv("SIGN_KEY_PASSWORD"))
            }
        } else {
            def debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
            free {
                storeFile debugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
            pro {
                storeFile debugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    flavorDimensions = ["tier"]
    productFlavors {
        free {
            dimension "tier"
            applicationId "vn.unlimit.vpngate"
            signingConfig signingConfigs.free
            versionCode 139
            versionName "2.3.6"
        }

        pro {
            dimension "tier"
            applicationId "vn.unlimit.vpngatepro"
            signingConfig signingConfigs.pro
            versionCode 128
            versionName "2.2.7"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            versionNameSuffix "-dev"
        }
    }
    androidComponents {
        // Keep only the proRelease variant on non-CI machines so the IDE's
        // Build Variants panel shows a single entry. CI (CI env var set)
        // keeps all variants because the workflow builds freeRelease too.
        if (System.getenv("CI") == null) {
            beforeVariants(selector().withBuildType("debug")) { variant ->
                variant.enabled = false
            }
            beforeVariants(selector().withFlavor("tier", "free")) { variant ->
                variant.enabled = false
            }
        }
        onVariants(selector().withBuildType("debug")) { variant ->
            def keystoreFile = rootProject.file("keyStore/release.jks")
            // When the release keystore is not present locally, debug builds
            // fall back to the default debug keystore.
            if (keystoreFile.exists()) {
                def flavorName = variant.productFlavors[0].second
                def androidExt = project.extensions.getByName("android")
                def signingConfig = androidExt.signingConfigs.findByName(flavorName)
                if (signingConfig != null) {
                    variant.signingConfig.setConfig(signingConfig)
                    // Sign the androidTest APK with the same key so it matches the
                    // target's signature (otherwise connectedAndroidTest fails with
                    // "Permission Denial: starting instrumentation ... signature matching")
                    if (variant.androidTest != null) {
                        variant.androidTest.signingConfig.setConfig(signingConfig)
                    }
                }
            }
        }
    }
    useLibrary 'android.test.runner'

    useLibrary 'android.test.base'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'vn.unlimit.vpngate'
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

ext.glideVersion = '5.0.9'
dependencies {
    implementation fileTree(include: ['*.jar', '*.so'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation("com.github.bumptech.glide:glide:$glideVersion@aar") {
        exclude group: "com.android.support"
        transitive = true
    }
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'com.pixplicity.sharp:sharp:1.1.3@aar'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation project(path: ':vpnLib')
    implementation project(path: ':sstpClient')
    implementation project(path: ':SoftEtherClient')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    def room_version = "2.7.1"

    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")
    ksp "androidx.room:room-compiler:$room_version"

}
